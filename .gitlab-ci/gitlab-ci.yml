stages:
  - prepare
  - lint
  - build
  - tests
  - report
  - publish
  - deploy

include:
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/pre-commit@2
  - project: univention/infrastructure/docker-services
    file:
      - kaniko.yml
  - project: univention/dev/tooling/ci-components
    file:
      - fragments/openstack.yaml
  # Replaces the hand-rolled 'allure_report' job. What it adds is the history:
  # the trend lives in the project's package registry, one entry per run, so a
  # branch is measured against main instead of being a snapshot on its own.
  #
  # No 'needs': the report is collected by stage ordering, so it is still
  # produced when 'run_tests' fails -- which is the run it is wanted for.
  - component: $CI_SERVER_FQDN/univention/dev/tooling/ci-components/allure@2.15.0
    inputs:
      report_stage: report
      publish_stage: publish
      results_paths: "results/allure-results"

# The one click that starts the whole matrix. GitLab offers a "Run all manual"
# control above a stage, but only while every job in that stage is manual, and
# it disappears the moment a non-manual job lands there -- silently, with no
# warning. A gate does not depend on that: the machines are ordinary automatic
# jobs waiting on one manual job, so there is one button wherever the stage
# grows to.
#
# 'allow_failure: false' is not the default here and has to be written out:
# for 'when: manual' outside 'rules' it defaults to *true*. Left alone, the
# pipeline would run straight past this gate, skip 'run_tests' for want of its
# 'needs', and hand 'allure:report' a pipeline with no results in it. Set to
# false the gate blocks, exactly as 'run_tests' did when it was the manual job.
start_tests:
  stage: build
  needs: []
  when: manual
  allow_failure: false
  script:
    - "true"

# One machine per Python version, running at the same time rather than one
# after another. Of a 28 minute run, only the first 4.8 minutes were the
# machine coming up and joining the domain -- the rest was the four versions
# in sequence, about 5.7 minutes each. Split up, a run is roughly 10 minutes
# whatever the number of versions, and each version costs one more machine
# instead of another six minutes on every run.
#
# Each job fetches its own 'results/', turns its report into this version's
# pass or fail, and publishes it. Downstream, GitLab merges the four: the
# reports are named after the version and the Allure results are named by uuid,
# so nothing collides.
run_tests:
  extends: .run_openstack_cfg
  stage: tests
  timeout: 120 minutes
  allow_failure: False
  needs:
    - job: start_tests
      artifacts: false
  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
  variables:
    TARGET_VERSION: "5.2-5"
    OPENSTACK_CFG_FILE: ".gitlab-ci/branch_tests.cfg"
    COVERAGE_LIMIT: 93
  script:
    - mkdir results
    - !reference [.run_openstack_cfg, script]
    # Fails the job when this version's report contains failures, and shrinks
    # the XML on the way -- GitLab refuses to parse the unshrunk one. It has to
    # run before the artifacts are uploaded, which is why it is a script step
    # rather than a job of its own.
    - .gitlab-ci/parse_junit.py
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    # A failed run is the one the report is wanted for, so the results have to
    # be uploaded then too.
    when: always
    paths:
      - results
    reports:
      junit: results/report_$PYTHON_VERSION.xml
      coverage_report:
        coverage_format: cobertura
        path: results/coverage_$PYTHON_VERSION.xml

docs:
  image: gitregistry.knut.univention.de/univention/dev/tooling/ci-components/uv
  stage: build
  script:
    - make docs
  artifacts:
    paths:
      - docs/_build/html
    expose_as: "Docs"

docs_pages:
  stage: deploy
  needs:
    - docs
  script:
    - "true"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  pages:
    publish: docs/_build/html
